name: CI

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate schema (fixtures and posts/)
        run: python -m inspiration validate

      - name: Build site (empty posts/)
        run: python -m inspiration build

      - name: Run tests
        run: pytest tests/
