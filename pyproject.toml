[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inspiration-blog"
version = "0.1.0"
description = "Slashdot-style inspiration blog from curated X post JSON"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
dependencies = [
  "sphinx>=7.0",
  "myst-parser>=2.0",
  "jsonschema>=4.20",
  "PyYAML>=6.0",
]

[project.scripts]
inspiration = "inspiration.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["inspiration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
